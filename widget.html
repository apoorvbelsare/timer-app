<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer</title>
  </head>
  <body>
    <div id="app" class="widget">
      <div class="bar">
        <div class="main">
          <div class="ring">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle class="track" cx="50" cy="50" r="42" />
              <circle id="arc" class="arc" cx="50" cy="50" r="42" transform="rotate(-90 50 50)" />
            </svg>
            <div class="ring-label">
              <span id="ring-value"></span>
              <span id="ring-unit"></span>
            </div>
          </div>
          <div class="info">
            <div id="title" class="title"></div>
            <div id="step" class="step"></div>
            <div id="until" class="until"></div>
            <div id="next" class="next"></div>
          </div>
          <div class="corner">
            <button id="finish-block" class="icon-btn" title="Finish this block now" aria-label="Finish this block now" hidden>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" /></svg>
            </button>
            <button id="im-stuck" class="icon-btn" title="I’m stuck" aria-label="I’m stuck">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 6a2 2 0 1 1 3 1.7c-.6.4-1 .8-1 1.6M8 12v.01" /></svg>
            </button>
            <button id="check-out" class="icon-btn" title="Check out" aria-label="Check out">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 3H3v10h3.5M10 5l3 3-3 3M13 8H6.5" /></svg>
            </button>
            <button id="open-focus" class="icon-btn" title="Focus mode" aria-label="Focus mode">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 9.5c1.6-1.4 3-1.4 4.2 0 1-1.6 2.3-1.8 3.9-.6M8 3.5c1.2-.9 2.4-.9 3.6 0" /></svg>
            </button>
            <button id="open-planner" class="icon-btn" title="Open planner" aria-label="Open planner">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h8" /></svg>
            </button>
            <button id="toggle-dock" class="icon-btn" title="Dock to taskbar" aria-label="Dock to taskbar">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v6h-11zM2 13h12" /></svg>
            </button>
          </div>
        </div>
        <div id="strip" class="strip"></div>
        <div id="extras" class="extras" hidden></div>
      </div>
      <div id="prompt" class="prompt" hidden></div>
    </div>
    <script type="module" src="/src/widget.ts"></script>
  </body>
</html>
